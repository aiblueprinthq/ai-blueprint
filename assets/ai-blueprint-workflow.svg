<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">AI Blueprint core workflow</title>
  <desc id="description">Plan the project, generate context, specify one work item, implement it, verify it, and complete it. Fix issues by returning to implementation, then repeat for the next work item. Brief, prototype, and debug are optional tools.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#dce8ec" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15342a" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2161e8"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 0.14em; }
      .stage { font-size: 12px; font-weight: 800; letter-spacing: 0.11em; }
      .command { font-size: 24px; font-weight: 800; }
      .body { font-size: 14px; font-weight: 600; }
      .artifact { font-size: 12px; font-weight: 700; }
      .loop { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="718" rx="28" fill="#f7f9f7" stroke="#d5dfda" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="718" rx="28" fill="url(#grid)" opacity="0.72"/>

  <g class="sans">
    <text x="48" y="56" class="eyebrow" fill="#2161e8">THE CORE WORKFLOW</text>
    <text x="48" y="94" font-size="28" font-weight="800" fill="#17241f">Plan when direction changes. Repeat the work loop.</text>
    <text x="48" y="122" font-size="14" font-weight="600" fill="#65716c">Run /overview after material plan changes, not before every feature.</text>

    <g transform="translate(48 143)">
      <rect width="196" height="34" rx="17" fill="#edf2ef" stroke="#b8c8c0"/>
      <text x="98" y="22" class="mono artifact" text-anchor="middle" fill="#42534c">/onboard or /adopt</text>
    </g>

    <rect x="28" y="190" width="384" height="270" rx="22" fill="#ffffff" fill-opacity="0.72" stroke="#d5dfda" stroke-width="2"/>
    <rect x="412" y="190" width="760" height="270" rx="22" fill="#ffffff" fill-opacity="0.72" stroke="#d5dfda" stroke-width="2"/>
    <text x="48" y="215" class="stage" fill="#65716c">RUN WHEN PLANS CHANGE</text>
    <text x="432" y="215" class="stage" fill="#2161e8">REPEAT FOR EACH WORK ITEM</text>

    <path d="M 208 335 H 228" fill="none" stroke="#2161e8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 400 335 H 420" fill="none" stroke="#2161e8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 592 335 H 612" fill="none" stroke="#2161e8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 784 335 H 804" fill="none" stroke="#2161e8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 976 335 H 996" fill="none" stroke="#2161e8" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(48 225)" filter="url(#shadow)">
      <rect width="160" height="220" rx="18" fill="#ffffff" stroke="#aebfb6" stroke-width="2"/>
      <text x="20" y="33" class="stage" fill="#65716c">01  PLAN</text>
      <text x="20" y="77" class="command" fill="#17241f">Plan</text>
      <text x="20" y="107" class="body" fill="#52605a">Define the product</text>
      <text x="20" y="129" class="body" fill="#52605a">and ordered work.</text>
      <rect x="14" y="158" width="132" height="46" rx="10" fill="#eef3ff" stroke="#b8c9f4"/>
      <text x="80" y="178" class="mono artifact" text-anchor="middle" fill="#274a91">project-plan.md</text>
      <text x="80" y="195" class="mono artifact" text-anchor="middle" fill="#274a91">build-plan.md</text>
    </g>

    <g transform="translate(240 225)" filter="url(#shadow)">
      <rect width="160" height="220" rx="18" fill="#2161e8" stroke="#1247ad" stroke-width="2"/>
      <text x="20" y="33" class="stage" fill="#bed1ff">02  CONTEXT</text>
      <text x="20" y="77" class="mono command" fill="#ffffff">/overview</text>
      <text x="20" y="107" class="body" fill="#e2eaff">Generate working</text>
      <text x="20" y="129" class="body" fill="#e2eaff">project context.</text>
      <rect x="14" y="158" width="132" height="46" rx="10" fill="#174fca" stroke="#6e9cff"/>
      <text x="80" y="187" class="mono artifact" style="font-size: 10px" text-anchor="middle" fill="#ffffff">project-overview.md</text>
    </g>

    <g transform="translate(432 225)" filter="url(#shadow)">
      <rect width="160" height="220" rx="18" fill="#2161e8" stroke="#1247ad" stroke-width="2"/>
      <text x="20" y="33" class="stage" fill="#bed1ff">03  SPECIFY</text>
      <text x="20" y="77" class="mono command" fill="#ffffff">/feature</text>
      <text x="20" y="107" class="body" fill="#e2eaff">Use /fix for an</text>
      <text x="20" y="129" class="body" fill="#e2eaff">unplanned change.</text>
      <rect x="14" y="158" width="132" height="46" rx="10" fill="#174fca" stroke="#6e9cff"/>
      <text x="80" y="187" class="mono artifact" style="font-size: 10.5px" text-anchor="middle" fill="#ffffff">current-feature.md</text>
    </g>

    <g transform="translate(624 225)" filter="url(#shadow)">
      <rect width="160" height="220" rx="18" fill="#2161e8" stroke="#1247ad" stroke-width="2"/>
      <text x="20" y="33" class="stage" fill="#bed1ff">04  BUILD</text>
      <text x="20" y="77" class="mono command" style="font-size: 19px" fill="#ffffff">/implement</text>
      <text x="20" y="107" class="body" fill="#e2eaff">Build in small,</text>
      <text x="20" y="129" class="body" fill="#e2eaff">reviewed steps.</text>
      <rect x="14" y="158" width="132" height="46" rx="10" fill="#174fca" stroke="#6e9cff"/>
      <text x="80" y="187" class="mono artifact" text-anchor="middle" fill="#ffffff">working code</text>
    </g>

    <g transform="translate(816 225)" filter="url(#shadow)">
      <rect width="160" height="220" rx="18" fill="#fff7e7" stroke="#e0b65e" stroke-width="2"/>
      <text x="20" y="33" class="stage" fill="#9b6a17">05  VERIFY</text>
      <text x="20" y="77" class="mono command" fill="#2f2a1e">/check</text>
      <text x="20" y="107" class="mono body" fill="#6d6045">/check guide</text>
      <text x="20" y="129" class="mono body" fill="#6d6045">/audit (optional)</text>
      <rect x="14" y="158" width="132" height="46" rx="10" fill="#fffdf7" stroke="#e5c887"/>
      <text x="80" y="187" class="mono artifact" style="font-size: 10.5px" text-anchor="middle" fill="#76551b">evidence + findings</text>
    </g>

    <g transform="translate(1008 225)" filter="url(#shadow)">
      <rect width="144" height="220" rx="18" fill="#2161e8" stroke="#1247ad" stroke-width="2"/>
      <text x="18" y="33" class="stage" fill="#bed1ff">06  COMPLETE</text>
      <text x="18" y="77" class="mono command" style="font-size: 19px" fill="#ffffff">/complete</text>
      <text x="18" y="107" class="body" fill="#e2eaff">Archive, commit,</text>
      <text x="18" y="129" class="body" fill="#e2eaff">and merge.</text>
      <rect x="13" y="158" width="118" height="46" rx="10" fill="#174fca" stroke="#6e9cff"/>
      <text x="72" y="187" class="mono artifact" text-anchor="middle" fill="#ffffff">history/</text>
    </g>

    <path d="M 896 447 V 491 H 704 V 449" fill="none" stroke="#2161e8" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
    <text x="800" y="482" class="loop" text-anchor="middle" fill="#2161e8">FIX ISSUES AND REPEAT</text>

    <path d="M 1080 447 V 548 H 512 V 449" fill="none" stroke="#2161e8" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
    <text x="796" y="540" class="loop" text-anchor="middle" fill="#2161e8">NEXT WORK ITEM</text>

    <g transform="translate(165 578)">
      <rect width="870" height="112" rx="20" fill="#ffffff" stroke="#bdcbc4" stroke-width="2"/>
      <text x="24" y="32" class="stage" fill="#65716c">OPTIONAL, WHEN NEEDED</text>
      <g class="mono body" text-anchor="middle">
        <g transform="translate(24 49)">
          <rect width="150" height="42" rx="12" fill="#eef3ff" stroke="#b8c9f4"/>
          <text x="75" y="27" fill="#244b9d">/brief</text>
        </g>
        <g transform="translate(190 49)">
          <rect width="150" height="42" rx="12" fill="#eef3ff" stroke="#b8c9f4"/>
          <text x="75" y="27" fill="#244b9d">/prototype</text>
        </g>
        <g transform="translate(356 49)">
          <rect width="150" height="42" rx="12" fill="#eef3ff" stroke="#b8c9f4"/>
          <text x="75" y="27" fill="#244b9d">/debug</text>
        </g>
      </g>
      <text x="529" y="73" class="body" fill="#65716c">Not part of every run.</text>
    </g>
  </g>
</svg>
