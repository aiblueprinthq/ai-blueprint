name: Feature request
description: Propose an improvement to the installer or workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: before-submitting
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for a similar request.
          required: true
        - label: This request is about the reusable Blueprint workflow, not an app feature.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or installer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the behavior or result you want without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installer or updater
        - Planning and project context
        - Feature or fix workflow
        - Verification and testing
        - Audit and findings ledger
        - Completion or release
        - Tool adapter
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can users do today, and why is it not enough?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized examples, links, or screenshots if they clarify the request.
